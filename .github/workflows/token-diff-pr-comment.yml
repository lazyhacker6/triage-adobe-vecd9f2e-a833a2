name: Token Diff Generate

# Fork-PR producer: the pull_request workflow file is taken from the PR head,
# so the PR author controls every byte of the uploaded token-diff-report artifact.
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  token-diff-generate:
    runs-on: [self-hosted, linux, x64]
    steps:
      - name: Save report for comment workflow
        run: |
          mkdir -p /tmp/artifact
          echo "${{ github.event.pull_request.number }}" > /tmp/artifact/pr-number.txt
          echo "true" > /tmp/artifact/diff-generated.txt
          echo '' | base64 -d > /tmp/artifact/diff-content.txt

      - name: Upload diff artifact
        uses: actions/upload-artifact@v4
        with:
          name: token-diff-report
          path: /tmp/artifact
          retention-days: 1
